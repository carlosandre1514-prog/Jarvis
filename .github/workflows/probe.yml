name: Diagnostico (temporario)
on:
  push:
    branches: [ccr-5f814887-v5p016]
    paths: [".github/probe/**", ".github/workflows/probe.yml"]
permissions:
  contents: read
  pages: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configuracao do Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/pages || true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Spaces do Hugging Face
        working-directory: .github/probe
        run: |
          npm init -y >/dev/null
          npm i @gradio/client@1 >/dev/null 2>&1
          timeout 60 node probe.mjs || true
          for s in tencent/Hunyuan3D-2 tencent/Hunyuan3D-2.1 trellis-community/TRELLIS JeffreyXiang/TRELLIS black-forest-labs/FLUX.1-schnell; do
            timeout 90 node probe.mjs "$s" || echo "TIMEOUT/ERRO em $s"
          done
