name: Diagnostico (temporario)
on:
  push:
    branches: [ccr-5f814887-v5p016]
    paths: [".github/probe/**", ".github/workflows/probe.yml"]
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [white]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pollinations
        if: matrix.mode == 'white'
        run: bash .github/probe/pollinations.sh || true
      - name: Build do site
        working-directory: web
        run: |
          npm ci
          BASE_PATH=/Jarvis npx next build
          mkdir -p ../site && cp -r out ../site/Jarvis
      - name: Teste no navegador (${{ matrix.mode }})
        working-directory: .github/probe
        run: |
          npm init -y >/dev/null
          npm i playwright@1.56.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          (node static.mjs ../../site 5050 &) ; sleep 2
          timeout 900 node e2e.mjs ${{ matrix.mode }} || echo "saiu com erro"
