name: Diagnostico (temporario)
on:
  push:
    branches: [ccr-5f814887-v5p016]
    paths: [".github/probe/**", ".github/workflows/probe.yml"]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: https://carlosandre1514-prog.github.io/Jarvis/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Espera o GitHub Pages publicar esta versão
        run: |
          want=$(grep -o '_next/static/chunks/app/page-[a-z0-9]*\.js' index.html | head -1)
          echo "esperando $want"
          for i in $(seq 1 60); do
            if curl -s "$SITE_URL?nocache=$i" | grep -q "$want"; then echo "publicado"; exit 0; fi
            sleep 10
          done
          echo "ainda não publicado"; exit 1
      - name: Teste no site real (modo branco)
        working-directory: .github/probe
        run: |
          npm init -y >/dev/null
          npm i playwright@1.56.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          timeout 900 node e2e.mjs white || echo "saiu com erro"
