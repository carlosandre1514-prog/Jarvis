name: Diagnostico (temporario)
on:
  push:
    branches: [ccr-5f814887-v5p016]
    paths: [".github/probe/**", ".github/workflows/probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        test: [hunyuan-all, hunyuan21-all]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Teste ${{ matrix.test }}
        working-directory: .github/probe
        run: |
          npm init -y >/dev/null
          npm i @gradio/client@2.7.1 >/dev/null 2>&1
          timeout 600 node pipeline.mjs ${{ matrix.test }} || echo "saiu com erro/timeout"
