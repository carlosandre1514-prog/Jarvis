name: Diagnostico (temporario)
on:
  push:
    branches: [ccr-5f814887-v5p016]
    paths: [".github/probe/**", ".github/workflows/probe.yml"]
permissions:
  contents: read
  pages: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configuracao do Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/pages || true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Spaces do Hugging Face
        working-directory: .github/probe
        run: |
          npm init -y >/dev/null
          npm i @gradio/client@1 >/dev/null 2>&1
          for t in hunyuan-shape hunyuan-all trellis; do
            echo "################ $t"
            timeout 420 node pipeline.mjs "$t" || echo "TIMEOUT em $t"
          done
