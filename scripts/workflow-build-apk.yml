# Criado pelo Nexus. Gera o APK de um projeto enviado para o branch nexus/<projeto>.
name: Nexus · build do APK
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch com o código do projeto
        required: true
      kind:
        description: Tipo do projeto (expo, site, vite-react, phaser, three)
        required: true
        default: expo
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.kind == 'expo' && '17' || '21' }}
      - name: Dependências
        run: npm install --no-audit --no-fund
      - name: Build (Expo)
        if: ${{ inputs.kind == 'expo' }}
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease --no-daemon
          mkdir -p ../saida && cp app/build/outputs/apk/release/*.apk ../saida/
      - name: Build (Capacitor)
        if: ${{ inputs.kind != 'expo' }}
        run: |
          if [ -f vite.config.js ] || [ -f vite.config.ts ]; then npx vite build --base=./ --outDir dist; fi
          [ -d android ] || npx cap add android
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon
          mkdir -p ../saida && cp app/build/outputs/apk/debug/*.apk ../saida/
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: saida/*.apk
          retention-days: 7
